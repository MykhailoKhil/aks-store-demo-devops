# Default values for aks-store Helm chart
# This is a YAML-formatted file.

# Global settings
global:
  # Image registry settings
  imageRegistry: ""
  # Image pull secrets
  imagePullSecrets: []
  # Node selector for all components
  nodeSelector:
    "kubernetes.io/os": linux
  # Common labels for all resources
  commonLabels: {}
  # Common annotations for all resources
  commonAnnotations: {}

# RabbitMQ settings
rabbitmq:
  enabled: true
  image:
    repository: mcr.microsoft.com/mirror/docker/library/rabbitmq
    tag: 3.10-management-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    amqpPort: 5672
    httpPort: 15672
  auth:
    username: "username"
    password: "password"
  plugins:
    - rabbitmq_management
    - rabbitmq_prometheus
    - rabbitmq_amqp1_0
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

# Order Service settings
orderService:
  enabled: true
  image:
    repository: ghcr.io/azure-samples/aks-store-demo/order-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: 1m
      memory: 50Mi
    limits:
      cpu: 75m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 3000
  env:
    FASTIFY_ADDRESS: "0.0.0.0"
  probes:
    startup:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 5
    readiness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 5
      failureThreshold: 3
    liveness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 3
      failureThreshold: 5

# Product Service settings
productService:
  enabled: true
  image:
    repository: ghcr.io/azure-samples/aks-store-demo/product-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: 1m
      memory: 1Mi
    limits:
      cpu: 2m
      memory: 50Mi
  service:
    type: ClusterIP
    port: 3002
  env:
    AI_SERVICE_URL: "http://ai-service:5001/"
  probes:
    startup:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 5
      failureThreshold: 3
    liveness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 3
      failureThreshold: 5

# Store Frontend settings
storeFront:
  enabled: true
  image:
    repository: ghcr.io/azure-samples/aks-store-demo/store-front
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: 1m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  probes:
    startup:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 3
      failureThreshold: 3
    liveness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 3
      failureThreshold: 5

# Ingress settings
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          service: store-front
          port: 80
        - path: /api/orders
          pathType: Prefix
          service: order-service
          port: 3000
        - path: /api/products
          pathType: Prefix
          service: product-service
          port: 3002
  tls: []

# Network Policy settings
networkPolicy:
  enabled: true
  # Default deny all ingress traffic
  defaultDeny: false

# Pod Disruption Budget settings
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Pod Security Context
podSecurityContext:
  enabled: true
  fsGroup: 1001

# Container Security Context
containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
