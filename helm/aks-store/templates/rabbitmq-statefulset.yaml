{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aks-store.fullname" . }}-rabbitmq
  labels:
    {{- include "aks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "aks-store.fullname" . }}-rabbitmq
  replicas: {{ .Values.rabbitmq.replicas }}
  selector:
    matchLabels:
      {{- include "aks-store.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "aks-store.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
    spec:
      terminationGracePeriodSeconds: 60
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      containers:
      - name: rabbitmq
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          runAsUser: {{ .Values.containerSecurityContext.runAsUser }}
          runAsNonRoot: {{ .Values.containerSecurityContext.runAsNonRoot }}
          readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
          allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
        {{- end }}
        image: "{{ .Values.global.imageRegistry }}{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
        imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
        lifecycle:
          preStop:
            exec:
              command: ["rabbitmqctl", "stop"]
        ports:
        - containerPort: {{ .Values.rabbitmq.service.amqpPort }}
          name: rabbitmq-amqp
        - containerPort: {{ .Values.rabbitmq.service.httpPort }}
          name: rabbitmq-http
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: {{ .Values.rabbitmq.auth.username | quote }}
        - name: RABBITMQ_DEFAULT_PASS
          value: {{ .Values.rabbitmq.auth.password | quote }}
        resources:
          {{- toYaml .Values.rabbitmq.resources | nindent 10 }}
        livenessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "status"]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "check_port_connectivity"]
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: rabbitmq-enabled-plugins
          mountPath: /etc/rabbitmq/conf.d
        - name: rabbitmq-config
          mountPath: /etc/rabbitmq/rabbitmq.conf
          subPath: rabbitmq.conf
        {{- if .Values.rabbitmq.persistence.enabled }}
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        {{- end }}
      volumes:
      - name: rabbitmq-enabled-plugins
        configMap:
          name: {{ include "aks-store.fullname" . }}-rabbitmq-plugins
          items:
          - key: enabled_plugins
            path: enabled_plugins
      - name: rabbitmq-config
        configMap:
          name: {{ include "aks-store.fullname" . }}-rabbitmq-plugins
          items:
          - key: rabbitmq.conf
            path: rabbitmq.conf
  {{- if .Values.rabbitmq.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.rabbitmq.persistence.storageClass }}
      storageClassName: {{ .Values.rabbitmq.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.rabbitmq.persistence.size }}
  {{- end }}
{{- end }}
